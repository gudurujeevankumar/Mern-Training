<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
    <script>
        // sum of digits js program

        // by using while loop
        let num = prompt("Enter the number");
        let sum = 0;
        while(num>0)
        {
            sum += (num%10);
            num = Math.trunc(num/10)
        }
        console.log(sum);
    </script>
</head>
<body>
    <h1>Looping problems</h1>
</body>
</html>
