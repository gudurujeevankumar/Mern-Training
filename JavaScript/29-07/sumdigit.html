<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of digits</title>
    <script>
        // sum of digits in a number by using for loop
        let n = prompt("Enter the number");
        let s = 0;
        for(n;n>0;n = Math.trunc(n/10))
        {
            s += (n%10);
        }
        console.log(s);
    </script>
</head>

</body>
</html>
