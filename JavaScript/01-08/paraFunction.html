<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parameterised Function</title>

</head>
<body>
    <script>
        
        function greet(name = 'User'){
            
            console.log(`Hello ${name}`)
        }
        greet('Basha')
        greet()

        
    </script>
</body>
</html>
