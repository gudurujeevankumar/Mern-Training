<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Cards</title>
    <link rel="stylesheet" href="../../../Bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>

<body>
    <header class="bg-warning p-3 d-flex justify-content-between align-items-center">
        <h1 class="m-0">Jcart</h1>
        <button class="btn btn-primary">Login</button>
    </header>

    <section class="container-fluid mt-4">
        <div id="cards-container" class="row"></div>
    </section>

    <script>
        let obj = [
            {
                id: 1,
                pname: 'iPhone 17',
                description: 'iPhone 17 with latest processor',
                price: 80000,
                count: 0
            },
            {
                id: 2,
                pname: 'MacBook Air',
                description: 'MacBook M5 with latest processor',
                price: 100000,
                count: 0
            },
            {
                id: 3,
                pname: 'iMac',
                description: 'iMac M5 with latest processor',
                price: 150000,
                count: 0
            },
            {
                id: 4,
                pname: 'Samsung Galaxy S25',
                description: 'Samsung flagship phone with advanced camera',
                price: 75000,
                count: 0
            },
            {
                id: 5,
                pname: 'iPad Air',
                description: 'iPad Air with powerful processor',
                price: 60000,
                count: 0
            },
            {
                id: 6,
                pname: 'Apple Watch',
                description: 'Smartwatch with health and fitness features',
                price: 45000,
                count: 0
            },
            {
                id: 7,
                pname: 'Sony Headphones',
                description: 'Wireless noise cancelling headphones',
                price: 30000,
                count: 0
            }
        ];

        function dataHandle() {
            let cardCont = document.getElementById('cards-container');
            let cards = '';

            obj.forEach((ele) => {

                let totalPrice = ele.price * ele.count;

                cards += `
                        <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                            <div class="card text-center h-100 shadow-sm">
                                <div class="card-body">
                                    <h4 class="card-title">${ele.pname}</h4>
                                    <p class="card-text">${ele.description}</p>
                                    <h5>Price: ₹ ${ele.price}</h5>
                                    <h5>Total: ₹ ${totalPrice}</h5>
                                    <div class="mt-3">
                                        <button class="btn btn-outline-danger" onclick="handleDec(${ele.id})">-</button>
                                        <span class="mx-3 fs-5">${ele.count}</span>
                                        <button class="btn btn-outline-success" onclick="handleInc(${ele.id})">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        `;
            });

            cardCont.innerHTML = cards;
        }

        function handleInc(id) {
            let targetEle = obj.find((ele) => ele.id === id);
            targetEle.count++;
            dataHandle();
        }

        function handleDec(id) {
            let targetEle = obj.find((ele) => ele.id === id);

            if (targetEle.count > 0) {
                targetEle.count--;
            }

            dataHandle();
        }

        dataHandle();
    </script>
</body>

</html>
