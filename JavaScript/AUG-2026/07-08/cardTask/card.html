<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        #card {
            margin: 100px auto;
            box-shadow: 0px 0px 20px gray;
            border-radius: 20px;
            height: 500px;
            width: 350px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        button:hover {
            cursor: pointer;
            scale: 1.03;
        }

        #card>img {
            height: 60%;
            width: 280px;
        }

        #card #actions button {
            padding: 3px 30px;
            border-radius: 10px;
            border: none;
            margin-left: 20px;

        }
    </style>
</head>

<body>
    <div id="card">
        <img src="./image.png" alt="">
        <div id="actions">
            <button onclick="like()">❤️ <br>
                Like
            </button> 
            <span id="likes-count">0</span>

            <button onclick="dislike()">
                💔 <br>
                Dislike
            </button>
            <span id="dislike-count">0</span>
        </div>
        <div id="count">
            <p>Total Count : <span id="Total">0</span></p>

        </div>
    </div>

    <!-- Script -->
    <script>
        let likes = 0;
        let dislikes = 0;
        var total = 0;

        let likes_count = document.getElementById("likes-count");
        let dislike_count = document.getElementById("dislike-count");
        let total_count = document.getElementById("Total");

        function like() {
            
            likes++;
            likes_count.textContent = likes;
            
            total_fun();
        }

        function dislike() {
            
            dislikes++;
            dislike_count.textContent = dislikes;
            
            total_fun();
        }

        function total_fun() {
            
            total++;
            total_count.textContent = total;
        }

    </script>

</body>

</html>
