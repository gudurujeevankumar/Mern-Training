<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light and Dark Mode</title>
    <style>
        .container{
            border: solid 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 100vh;
            width: 100vw;
        }

        #btn{
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
        }

        #box{
            width: 500px;
            height: 100px;
            text-align: center;
            border: 1px solid;
            padding: 10px;
            border-radius: 10px;
        }

        .dark{
            background-color: grey;
            color: white;
        }
    </style>

<body>
    <div class="container">
        <button id="btn" class="dark">
            Change to Dark
        </button>

        <div id="box">
            <h1 id="heading">This is Light Mode</h1>
        </div>
    </div>
    <script>
        // getting elements
        let btn = document.getElementById("btn");
        let heading = document.getElementById("heading");
        let box = document.getElementById("box");

        btn.addEventListener('click',function(){
            box.classList.toggle('dark');
            btn.classList.toggle('dark');

            let i = btn.classList.contains("dark");
            if(i){
                heading.textContent = "This light mode";
                btn.textContent = "Change to dark";
                
            }
            else {
                
                heading.textContent = "This dark mode";
                btn.textContent = "Change to light";
            }

        })
    </script>
</body>

</html>
