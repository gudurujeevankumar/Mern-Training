<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factors</title>
    <script>
        let num = 10;
        let fact = 0;
        for(let i = 0; i<=num; i++){
            if(num%i == 0){
                fact += 1;
                if(fact==2){
                    console.log("Prime");
                    
                }
                else if(fact > 2){
                    console.log("Not Prime");
                    break;
                }
            }
        }
    </script>
</head>

</html>
