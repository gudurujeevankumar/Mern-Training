<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year</title>
    <script>
        y = prompt("Enter Year")
        m = prompt("Enter month")

        switch(m){
            case 1:
            case 3:
            case 5:
            case 7:
            case 8:
            case 10:
            case 12:
                console.log("31 Days");
                break;
            case 4:
            case 6:
            case 9:
            case 11:
                console.log("30 Days");
                break;

            case 2:
                if ((y %4 == 0)&&(y %100 != 0) || (y %400 == 0))
                console.log("29 Days");
                else console.log("28 Days")
    
        }
    </script>
</head>
<body>
    <h1>Leap Year</h1>
</body>
</html>
