<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
</head>

<body>
    <!-- Table -->
    <table id="table" border="1" cellspacing="0" cellpadding="5">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
            <th>Company</th>
        </tr>

    </table>



    <script>

        let table = document.getElementById('table');

        // fetch --> promise(result{body:..}) --> .json --> data
        function callAPI() {
            let obj = window.fetch("https://jsonplaceholder.typicode.com/users");

            let dt = obj.then((res) => {
                return res.json();
            })

            dt.then((data) => {
                let Adata = data;

                Adata.map((data,ind)=>{
                    let row = `
                                <td>${data.id}</td>
                                <td>${data.name}</td>
                                <td>${data.email}</td>
                                <td>${data.address.city}</td>
                                <td>${data.company.name}</td>
                                `
                    let HTMLCont = row;
                    let th = document.createElement('tr');
                    th.innerHTML = HTMLCont;
                    table.appendChild(th);
                })
            }).catch((err) => console.log(err));
        }
        callAPI();

    </script>
</body>

</html>
