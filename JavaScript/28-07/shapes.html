<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS SHAPES</title>
    <style>
        body{
            background-color: antiquewhite;
        }
        div{
            margin: 20px;
            display: inline-block;
        }
        .div-1{
            height: 0px;
            width: 0px;
            border-left: 100px solid;
            border-bottom: 100px solid;

            border-top: 100px solid transparent;
            border-right: 100px solid transparent;
        }

        .div-2{
            height: 0px;
            width: 0px;

            border-left: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-top: 100px solid;
            border-right: 100px solid;
        }
        .div-3{
            height: 0px;
            width: 0px;

            border-left: 100px solid transparent;
            border-bottom: 100px solid ;
            border-top: 100px solid transparent;
            border-right: 100px solid;
        }

        .div-4{
            height: 0px;
            width: 0px;

            border-left: 100px solid;
            border-bottom: 100px solid transparent;
            border-top: 100px solid;
            border-right: 100px solid transparent;
        }

        .div-5{
            height: 0px;
            width: 0px;

            border-left: 100px solid transparent;
            border-bottom: 100px solid;
            border-top: 100px solid transparent;
            border-right: 100px solid transparent;
        }

        .div-6{
            height: 0px;
            width: 0px;

            border-left: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-top: 100px solid;
            border-right: 100px solid transparent;
        }

        .div-7{
            height: 200px;
            width: 100px;
            background-color: black;
            border-radius: 50px;
        }


    </style>
</head>
<body>
    <h1>HTML CSS SHAPES</h1>

    <div class="div-1"></div> 
    <div class="div-2"></div>
    <div class="div-3"></div>
    <div class="div-4"></div>
    <div class="div-5"></div>
    <div class="div-6"></div>
    <div class="div-7"></div>
    <div class="div-8"></div>
    <div class="div-9"></div>
    <div class="div-10"></div>
</body>
</html>
