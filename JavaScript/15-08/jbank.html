<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBank - Login</title>

    <link rel="stylesheet" href="../../Bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <h1 class="m-0">JBank</h1>

        <button type="button" class="btn btn-outline-success" id="login-btn">
            Login
        </button>
    </header>


    <!-- Login Card -->
    <main class="container d-flex justify-content-center mt-5" id="login-container">

        <div class="card shadow-sm position-relative" id="login-card" style="width: 400px;">

            <!-- X Button -->
            <button type="button"
                    class="btn-close position-absolute top-0 end-0 m-3"
                    id="close-btn"
                    aria-label="Close">
            </button>

            <div class="card-body" id="card-body">

                <h2 class="card-title text-center mb-4">
                    Login
                </h2>

                <form action="" id="form-ele">

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter Username"
                            required
                        >
                    </div>


                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter Password"
                            required
                        >
                    </div>


                    <!-- Login Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            Login
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script>
        // Getting the elements
        let loginBtn = document.getElementById('login-btn');
        let closeBtn = document.getElementById('close-btn');
        let loginContainer = document.getElementById('login-container')

        closeBtn.addEventListener('click',()=>{
            loginContainer.style.visibility='hidden';
        })

        loginBtn.addEventListener('click',()=>{
            loginContainer.style.visibility='visible';
        })
    </script>

</body>

</html>
