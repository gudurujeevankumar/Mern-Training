<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
</head>
<body>

<h2>Add Task</h2>

<form id="taskForm">

    <label>Task ID</label><br>
    <input type="number" id="taskId" required><br><br>

    <label>Title</label><br>
    <input type="text" id="title" required><br><br>

    <label>Assigned Developer</label><br>
    <input type="text" id="developer" required><br><br>

    <label>Priority</label><br>
    <select id="priority">
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
    </select><br><br>

    <label>Estimated Hours</label><br>
    <input type="number" id="hours" required><br><br>

    <label>Status</label><br>
    <select id="status">
        <option>Todo</option>
        <option>Progress</option>
        <option>Complete</option>
        <option>Blocked</option>
    </select><br><br>

    <button type="submit">Add Task</button>

</form>

<hr>

<h2>Task List</h2>

<table border="1" cellpadding="10" id="taskTable">

    <thead>
        <tr>
            <th>Task ID</th>
            <th>Title</th>
            <th>Developer</th>
            <th>Priority</th>
            <th>Hours</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>

    </tbody>

</table>

<script src="script.js"></script>

</body>
</html>
