<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        div{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #outter {
            border: 1px solid;
            height: 200px;
            width: 200px;
        }
        #inner{
            border: 1px solid;
            height: 100px;
            width: 100px;
            border-radius: 50%;
        }

        #outter:hover {
            border-radius: 50%;
        }

        #outter:hover #inner{
            border-radius: 0px;
        }
        
    </style>
</head>
<body>
    <div id="outter">
        <div id="inner"></div>
    </div>
</body>
</html>
